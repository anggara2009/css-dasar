<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wireframe Landing Page - TokoKita</title>
    <link rel="stylesheet" href="style.css" />

  <body>
    <header class="navbar">
      <div><img src="https://i.pinimg.com/736x/8c/b0/8a/8cb08a963150553f12dc40795e5cb4a3.jpg" alt="Gambar Tidak Tersedia" width="60px" height="40px"></div>

    <section class="hero">
      <div class="hero-text">
        <h1>Toko Adidas Original</h1>
        <p>Beli Sepatu Adidas Di Toko Kami.</p>
        <a href="#" class="btn-cta">Belanja Sekarang</a>

          <img src="https://sin1.contabostorage.com/adef61e95f524badb0b95b15d2c793b7:portal/media/83831/boikot-adidas-menguat-usai-tampilkan-eks-idf-dalam-kampanye-iklan-20260909145139.jpg" alt="Gambar Tidak Tersedia" width="180px" "  />

        <div class="kartu">

          <p class="harga">Rp 120.000</p>
          <button class="btn-beli">Beli</button>
        </div>
        <div class="kartu">

        <div class="kartu">

          <p class="harga">Rp 2.700.000</p>
          <button class="btn-beli">Beli</button>

      </div>
